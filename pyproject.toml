[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personaldocagent"
version = "0.1.0"
description = "Personal document agent: indexing, classification and querying of a personal document collection (SQLite, deterministic pipeline and Mistral calls)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mistralai",
    "beautifulsoup4",
    "python-docx",
    "odfpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
personaldocagent = "personaldocagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
